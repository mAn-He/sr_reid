# srreid-clipreid: CLIP-ReID. README의 torch 1.8 + CUDA 10.2는 RTX 4090을 지원하지 않아 KPR과 같은 torch 1.13.0 cu117을 쓴다.
name: srreid-clipreid
channels:
  - conda-forge
dependencies:
  - python=3.10.13
  - pip
  - setuptools<81
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu117
      - torch==1.13.0+cu117
      - torchvision==0.14.0+cu117
      - numpy==1.23.5
      - Pillow==9.5.0
      - yacs==0.1.8
      - timm==0.9.12
      - scikit-image==0.22.0
      - tqdm==4.66.1
      - ftfy==6.1.3
      - regex==2023.12.25
      - PyYAML==6.0.1
