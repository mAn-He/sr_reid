      - einops==0.7.0
      - Pillow==9.5.0
      - PyYAML==6.0
      - numpy==1.26.4
      - scipy
      - tqdm
      - timm
      - fairscale
      - loralib
      - huggingface_hub==0.25.2
      - safetensors
