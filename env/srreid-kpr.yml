      - future==0.18.3
      - yacs==0.1.8
      - pandas==2.1.4
      - tabulate==0.9.0
      - deepdiff==6.7.1
      - wandb==0.16.2
      - monai==1.3.0
      - scikit-image==0.22.0
      - tqdm==4.66.1
      - omegaconf==2.3.0
      - scikit-learn==1.3.2
